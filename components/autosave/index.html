<!doctype html>
<meta charset="utf-8">
<script>
// Keeps the request in this browser's storage, and hands back what was there when the page opened.
// It talks to Streamlit with the plain component messages, so it needs no build step.
const KEY = "sf-film-parking-request";
function send(type, extra) {
  window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, extra), "*");
}
let opened = false;
window.addEventListener("message", function (event) {
  if (event.data.type !== "streamlit:render") return;
  const args = event.data.args;
  let value = {};
  try {
    const before = localStorage.getItem(KEY);
    if (before) value = JSON.parse(before);
    if (args.clear) localStorage.removeItem(KEY);
    if (args.data) localStorage.setItem(KEY, JSON.stringify({data: args.data, at: Date.now()}));
  } catch (error) {
    value = {blocked: true};
  }
  if (!opened) {
    opened = true;
    send("streamlit:setComponentValue", {value: value, dataType: "json"});
    send("streamlit:setFrameHeight", {height: 0});
  }
});
send("streamlit:componentReady", {apiVersion: 1});
</script>
